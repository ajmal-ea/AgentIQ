[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq_audience_research"
version = "0.1.0"
dependencies = [
    "agentiq[langchain]",
    "colorama==0.4.6",
]
requires-python = ">=3.10"
description = "Audience Research Agent for Google AdWords using NVIDIA AgentIQ"
keywords = ["ai", "agents", "adwords", "marketing", "research"]
classifiers = ["Programming Language :: Python"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.entry-points.'aiq.components']
aiq_audience_research = "aiq_audience_research.register" 