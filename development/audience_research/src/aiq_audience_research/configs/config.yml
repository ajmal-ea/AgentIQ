functions:
  # Keyword research tool
  keyword_research:
    _type: aiq_audience_research/keyword_research
    query: "default"
    max_results: 20
    include_search_volume: true
    include_competition: true
    description: "Performs keyword research for a specified query. Use this tool to discover relevant keywords, search volume, and competition data for marketing campaigns."

  # Competitor analysis tool
  competitor_analysis:
    _type: aiq_audience_research/competitor_analysis
    industry: "default"
    max_results: 5
    description: "Analyzes competitors in a specified industry. Use this tool to get information about competitor strategies, target audiences, and market positioning."

  # Demographic analysis tool
  demographic_analysis:
    _type: aiq_audience_research/demographic_analysis
    industry: "default"
    region: "United States"
    description: "Analyzes demographic and psychographic data for a specified industry and region. Use this tool to understand audience demographics, behaviors, and preferences."

  # Persona builder tool
  persona_builder:
    _type: aiq_audience_research/persona_builder
    industry: "default"
    persona_name: "Target Persona"
    number_of_personas: 2
    include_markdown_format: true
    description: "Creates detailed audience personas based on keyword research, competitor analysis, and demographic data. Use this tool to compile all gathered insights into actionable audience profiles."
    
  # Add audience research wrapper tool
  audience_research:
    _type: aiq_audience_research/audience_research
    mode: "default"
    output_directory: "./output"
    description: "Performs comprehensive audience research by coordinating keyword research, competitor analysis, and demographic analysis. Use this for end-to-end audience research."
    
embedders:
  # Define embedder for advanced search capabilities
  audience_research_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5

llms:
  # Define LLM to use for the agent
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.2
    max_tokens: 1024

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: audience_research

workflow:
  # Use tool calling agent as central orchestrator instead of React agent
  _type: tool_calling_agent
  # Give it access to our custom tools
  tool_names: [aiq_audience_research/keyword_research, aiq_audience_research/competitor_analysis, aiq_audience_research/demographic_analysis, aiq_audience_research/persona_builder, aiq_audience_research/audience_research]
  # tool_names: [keyword_research, competitor_analysis, demographic_analysis, persona_builder, audience_research]
  # Tell it which LLM to use
  llm_name: nim_llm
  # Make it verbose for debugging
  verbose: true
  # Handle tool errors gracefully
  handle_tool_errors: true
  # Retry parsing errors
  retry_parsing_errors: true
  # Maximum number of retries
  max_retries: 3
  # System prompt to guide the agent
  system_prompt: |
    You are an Audience Research Agent specialized in creating detailed audience personas for Google AdWords marketing campaigns.
    
    Your task is to gather information through keyword research, competitor analysis, and demographic analysis, 
    then compile this information into comprehensive audience personas that can be used for targeted marketing.
    
    When dealing with enterprise software companies targeting healthcare organizations:
    1. First use the audience_research tool to get an overview of the target audience
    2. Then use specific tools to gather more detailed information as needed
    3. Compile everything into a comprehensive audience persona
    
    DO NOT leave any response empty. Always provide detailed, well-structured responses and ask for clarification if needed.
  input_variables: ["question"]
  output_key: "output"
  constructor_args:
    agent_node_name: "agent" 