functions:
  # Web search tool
  web_search:
    _type: aiq_web_search/web_search
    query: "default"
    search_type: "general"
    num_results: 5
    include_snippets: true
    description: "Searches the web for real-time information. Use this tool to find current data, market trends, and analysis."

  # Web search workflow tool
  web_search_workflow:
    _type: aiq_web_search/web_search_workflow
    base_query: "default"
    num_searches: 3
    results_per_search: 5
    description: "Performs multiple web searches and combines results. Use this for comprehensive research that requires data from multiple sources."

llms:
  # Define LLM to use for the agent
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.2
    max_tokens: 1024

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: web_search

workflow:
  # Use tool calling agent as central orchestrator
  _type: tool_calling_agent
  # Give it access to our custom tools
  tool_names: [web_search, web_search_workflow]
  # Tell it which LLM to use
  llm_name: nim_llm
  # Make it verbose for debugging
  verbose: true
  # Handle tool errors gracefully
  handle_tool_errors: true
  # Retry parsing errors
  retry_parsing_errors: true
  # Maximum number of retries
  max_retries: 3
  # System prompt to guide the agent
  system_prompt: |
    You are a Web Research Agent specialized in finding and analyzing information from the internet.
    
    Your task is to search for and retrieve relevant information based on user queries.
    When using the web_search tool, you'll get individual search results.
    When using the web_search_workflow tool, you'll get combined results from multiple searches.
    
    Always provide detailed, relevant information based on search results.
    If search results don't provide enough information, you should try different search queries.
    
    DO NOT make up information. If you cannot find relevant data, admit that.
  input_variables: ["question"]
  output_key: "output"
  constructor_args:
    agent_node_name: "agent" 