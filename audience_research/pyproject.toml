[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audience_research"
version = "0.1.0"
description = "Audience research tools for AgentIQ"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "agentiq",
    "python-dotenv",
    "langchain",
    "langchain_community",
    "langchain_openai",
    "requests",
    "beautifulsoup4",
    "pandas",
    "faiss-cpu",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "black",
    "isort",
]

langchain = [
    "langchain[web-tools]",
    "tavily-python",
]

[project.scripts]
audience-research = "audience_research.cli:main"

[project.entry-points."aiq.plugins"]
audience_research = "audience_research.register" 