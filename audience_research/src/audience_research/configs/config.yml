functions:
  # Individual specialized agents
  keyword_research:
    _type: keyword_research
    description: "Research and identify relevant keywords for a target market"
    llm_name: nim_llm
    query: "${input}"
  
  competitor_analysis:
    _type: competitor_analysis
    description: "Analyze strategies of competitors in a target market"
    llm_name: nim_llm
    market: "${input}"
    industry: "${input}"
    competitors: null  # Will be dynamically set based on input if needed
  
  demographic_analysis:
    _type: demographic_analysis
    description: "Analyze demographics and psychographics of a target market"
    llm_name: nim_llm
    market: "${input}"
    industry: "${input}"
  
  persona_builder:
    _type: persona_builder
    description: "Build detailed audience personas based on research data"
    llm_name: nim_llm
    market: "${input}"
    industry: "${input}"
    keyword_data: null  # Will be filled during runtime
    competitor_data: null  # Will be filled during runtime
    demographic_data: null  # Will be filled during runtime
  
  # Web search tool using Tavily (built-in)
  internet_search:
    _type: tavily_internet_search
    description: "Search the web for market information and competitor data. USAGE: Input must be a JSON with 'query' field, e.g. {\"query\": \"your search query\"}"
    max_results: 5

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.2
  
  openai_llm:
    _type: openai
    model_name: gpt-4o
    temperature: 0.2

workflow:
  _type: react_agent
  tool_names: [internet_search, keyword_research, competitor_analysis, demographic_analysis, persona_builder]
  llm_name: nim_llm
  verbose: true
  retry_parsing_errors: true
  max_retries: 3
  additional_instructions: |
    IMPORTANT: When using tools, always format your input as a valid JSON object.
    
    For string-only tools like internet_search, use the format:
    {"query": "your search query"}
    
    For structured tools like persona_builder, use the format:
    {"input_data": {"name": "Persona Name", "description": "Persona description"}}
    
    Always wrap string values in double quotes and follow proper JSON syntax. 